[package]
name = "pebble"
version = "0.1.0"
edition = "2024"
description = "A distributed issue tracking system built on Git."

[dependencies]
color-eyre.workspace = true
chrono = "0.4.43"
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.149"
toml.workspace = true
const_format = "0.2"
nanoid.workspace = true

[dev-dependencies]
assert_cmd = "=2.1.2"
predicates = "=3.1.4"
tempfile.workspace = true
